// Solitude dedicated server config.
// Auto-exec'd by Host_Init in -dedicated mode (host.c:1510-1518:
// default.cfg -> server.cfg -> autoexec.cfg), before +map runs.
// Launch:  ./mac.sh server [map] [port]

hostname        "Solitude"
// r124: browser name rebuilt on every level spawn from %mode% and %map%
// (Slayer / Team Slayer / Swat / Firefight + the map file name). The line
// above is only the fallback used before the first map loads and it is what
// you see if this template is emptied.
// Mode only: the browser already prints the map in its own column and the
// name column is 15 chars, so "%mode%: %map%" used to clip to "Slayer: highgro".
sv_hostname_fmt "%mode%"

// ---- game ----
// r127: Team Slayer. deathmatch 1 + teamplay 1 is Team Slayer.
// r130: team size is explicit now -- BalanceTeams (client.qc) keeps each side
// at sv_team_size players and fills the remaining slots with bots up to
// lobby_bots, on every join, respawn and leave. Humans always take priority
// over bots and are placed on the side with fewer humans, so two friends end
// up on opposite teams before the bots fill in around them.
// maxplayers is headroom, not the target: 3v3 uses six slots, and the extra
// two let a friend connect even while the bots are at full strength (a bot is
// promoted out of the way). It must stay above sv_team_size * 2.
deathmatch      1          // 1 = Slayer (2 is Firefight, not for servers)
teamplay        1          // 1 = Team Slayer (red vs blue)
timelimit       15         // minutes per round, then the rotation moves on
fraglimit       0          // FFA cap; unused in Team Slayer
teamlimit       25         // team kills that end the round (and fill the HUD bar)
skill           1          // bot skill 0..3 -- 1 = human-rate turning, 20 Hz AI
                           // (2/3 turn instantly and see through walls: aimbots)
samelevel       0

// ---- map rotation ----
// sv_rotation 1 makes the end of a round change level instead of dumping
// every client back to the Matchmaking menu (ExitIntermission -> GotoNextMap).
// The next map comes from the per-map hook: under NETQUAKE
// stringserverinfokey(mapname) is just cvar_string(mapname), so one `set`
// line per map is the whole cycle. A map that is not listed restarts itself.
// Bots need a .way beside the .bsp or they stand still (both are in maps/).
// `set` is required: no engine cvar of this name exists, so a bare
// "sv_rotation 1" line is an unknown command and the QC read would get 0.
set sv_rotation  1
// Idle rotation: seconds without a human before the server hops to the next
// map on its own (0 disables). Without it a server nobody joined would sit on
// its starting map forever, because a round only ends through CheckRules in
// PlayerPreThink and BotPreFrame skips that for every bot.
set sv_rotate_empty 900
// playlist: highground -> pit -> blood gulch -> narrows -> lockdown -> ...
set highground      pit_optimized
set pit_optimized   babybloodgulch
set babybloodgulch  narsp
// r136 (user): the map called "narrows" is the big variant (menu name
// "Narrows Big"); "narsp" is the regular Narrows -- and it is the one
// with waypoints, so bots actually move on it.
set narsp           lockdown
set lockdown        highground

// ---- bots ----
// On a dedicated server the menu never runs, so lobby_bots is not registered
// by M_Init -- `set` creates it so QC's cvar("lobby_bots") reads it once the
// first human joins (CheckPowerups -> BotSpawner -> populate_bots).
// The sv_bots patch in the server backlog replaces this. Maps need a matching
// .way beside the .bsp or bots stand still (LoadWaypoint no-ops silently).
set lobby_bots 5

// r130: players per side. BalanceTeams tops each team up to this and never
// past it; 0 falls back to splitting (humans + lobby_bots) in half.
set sv_team_size 3

// ---- network ----
// port is set on the command line (-port); there is no port cvar.
// sv_public 0 = LAN only. The NetQuake LAN broadcast is NOT gated by
// sv_public, so clients on the same router still see the server in
// Join -> LAN search; it just never heartbeats to dpmaster.
// Set to 1 (+ net_masterextra1..3) to list it on the internet.
sv_public       0
sv_reportheartbeats 0      // only meaningful when sv_public is 1
// rcon_password is deliberately NOT set here: a password in a tracked file
// is a password in the repository. The dedicated container passes it in via
// RCON_PASSWORD (docker/entrypoint.sh) and a local ./mac.sh server can add
// +set rcon_password <value> on the command line. Empty = rcon disabled.
maxplayers      8

// ---- logging ----
// qconsole.log is written next to the binary when -condebug is passed.
