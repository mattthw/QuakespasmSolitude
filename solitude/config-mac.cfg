// Solitude — macOS/PC input overrides.
// Executed by mac.sh launch (+exec config-mac.cfg) AFTER config.cfg, so it
// only changes controls for keyboard+mouse play. The shipped config.cfg stays
// Vita-touch-true: MOUSE1 is deliberately impulse 67 there (tap-to-use pad
// without firing), and the "SPARTAN-OVERRIDE-PC" block inside config.cfg was
// authored in 2010 for an unknown PC client — this file supersedes it.
// Nothing here is ever sent to the Vita.

// Fire / secondary (impulse 67 = custom_secondary in weapons.qc)
bind "mouse1" "+attack"
bind "mouse2" "impulse 67"
bind "mwheelup" "impulse 10"
bind "mwheeldown" "impulse 9"

// Replace the Vita touch-gesture binds with real keys where they overlap.
// "e" stays impulse 29 (door/use) exactly as config.cfg has it.
bind "k" "+scores"

// Free the Enter key for menu selection (the shipped config binds it to
// +jump for the Vita's touch-A-button; on a keyboard Enter IS confirm and
// a bound key never reaches the menu's K_ENTER handler). Space still jumps.
unbind "ENTER"

// HUD on/off (engine cvar in gl_hud.c — hides the Vita overlay layer)
bind "F5" "toggle hide_hud"

// Clean HUD-free screenshot (README recipe: the author binds "," to this).
// Engine writes spasmNNNN.png into the game dir (repo/solitude/) — gitignored,
// treat it as the scratch folder. Pair with: noclip 1; crosshair 0.
bind "F6" "screenshot"
