// Solitude — macOS/PC input overrides.
// Executed by mac.sh launch (+exec config-mac.cfg) AFTER config.cfg, so it
// only changes controls for keyboard+mouse play. The shipped config.cfg stays
// Vita-touch-true: MOUSE1 is deliberately impulse 67 there (tap-to-use pad
// without firing), and the "SPARTAN-OVERRIDE-PC" block inside config.cfg was
// authored in 2010 for an unknown PC client — this file supersedes it.
// Nothing here is ever sent to the Vita.
// r99b: re-apply default.cfg's FULL bind table (verbatim copy) — spiked's
// config.cfg save unbindalls and runs AFTER default.cfg, wiping every key
// the engine didn't know was customized. Mac custom binds LATER in this
// file still win. Regenerate from default.cfg if that file's binds change.
bind "TAB" "+showscores"
bind "ENTER" "+jump"
bind "ESCAPE" "togglemenu"
bind "SPACE" "+jump"
bind "+" "sizeup"
bind "," "+moveleft"
bind "-" "sizedown"
bind "." "+moveright"
bind "/" "impulse 10"
bind "0" "impulse 0"
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "9" "screenshot"
bind "=" "sizeup"
bind "\" "+mlook"
bind "`" "toggleconsole"
bind "a" "+moveleft"
bind "c" "+movedown"
bind "d" "+moveright"
bind "s" "+back"
bind "t" "messagemode"
bind "w" "+forward"
bind "z" "+lookdown"
bind "~" "toggleconsole"
bind "ALT" "+strafe"
bind "SHIFT" "+speed"
bind "F1" "help"
bind "F2" "menu_save"
bind "F3" "menu_load"
bind "F4" "menu_options"
bind "F5" "menu_multiplayer"
bind "F6" "echo Screenshot mode enabled...; r_drawviewmodel 0;viewsize 120;fov 120;noclip 1;crosshair 0"
bind "F7" "echo Screenshot mode disabled...; r_drawviewmodel 1;viewsize 100;fov 90;noclip 0;crosshair 1"
bind "F10" "quit"
bind "F11" "screenshot"
bind "F12" "screenshot"
bind "INS" "+klook"
bind "DEL" "+lookdown"
bind "PGDN" "+lookup"
bind "END" "centerview"
bind "MOUSE1" "+attack"
bind "MOUSE2" "impulse 11"
bind "MOUSE3" "+mlook"
bind "MWHEELUP" "impulse 10"
bind "MWHEELDOWN" "impulse 10"
bind "r" "impulse 13" //pick up or reload
bind "q" "impulse 28" //grenade
bind "e" "impulse 29" //melee
bind "UPARROW" "impulse 11"
bind "DOWNARROW" "+showscores"
bind "LEFTARROW" "impulse 27"
bind "RIGHTARROW" "impulse 27"
bind "LSHOULDER" "impulse 28"
bind "LTRIGGER" "impulse 28"
bind "RTRIGGER" "+attack"
bind "RSHOULDER" "+attack"
bind "ABUTTON" "+jump"
bind "CROSS" "+jump"
bind "BBUTTON" "impulse 29"
bind "CIRCLE" "impulse 29"
bind "XBUTTON" "impulse 13"
bind "SQUARE" "impulse 13"
bind "YBUTTON" "impulse 10"
bind "TRIANGLE" "impulse 10"
bind "SELECT" "+showscores" //I think I still need to set this up in quakespasm engine
bind "PAUSE" "pause"


// Fire / secondary (impulse 67 = custom_secondary in weapons.qc)
bind "mouse1" "+attack"
bind "mouse2" "impulse 67"
bind "mwheelup" "impulse 10"
bind "mwheeldown" "impulse 9"

// Replace the Vita touch-gesture binds with real keys where they overlap.
// "e" stays impulse 29 (door/use) exactly as config.cfg has it.
bind "k" "+scores"

// Free the Enter key for menu selection (the shipped config binds it to
// +jump for the Vita's touch-A-button; on a keyboard Enter IS confirm and
// a bound key never reaches the menu's K_ENTER handler). Space still jumps.
unbind "ENTER"

// HUD on/off (engine cvar in gl_hud.c — hides the Vita overlay layer)
bind "F5" "toggle hud_mapshot"

// Waypointing / bot test keys (Mac only — n IS the mode switch, so it
// stays live always; impulses 100-103 are gated inert outside editor mode
// in QC, commit e2c5c2a7). Replaces the sizeup/sizedown clutter;
// gamma slider remains available via console.
unbind "+"
bind "n" "impulse 104"	// toggle waypoint editor
bind "=" "impulse 100"	// connect test bot (same team)
bind "-" "impulse 102"	// kick a bot
bind "v" "impulse 103"	// bot cam

// Editor menus run on impulses 1-10 (bot_ed.qc:188). The shipped config.cfg
// binds 9 to "screenshot" and 0 to "impulse 0" (inert), so menu rows [9]
// (page 2 / back) and [0] (main menu) were unpressable. F6/","/F11/F12 all
// still screenshot, so nothing is lost. Device keeps its 9/0 as-is.
bind "9" "impulse 9"
bind "0" "impulse 10"

// Clean HUD-free screenshot (README recipe: the author binds "," to this).
// Engine writes spasmNNNN.png into the game dir (repo/solitude/) — gitignored,
// treat it as the scratch folder. Pair with: noclip 1; crosshair 0.
bind "F6" "screenshot"
bind "," "screenshot"   // r86: mapshot workflow (was a manual bind)

// r88: photo-mode include (./mac.sh mapshot creates it; ./mac.sh launch deletes it).
// Missing-file case just prints "couldn't exec" (harmless). QS cfgs have no "if".
exec mapshot.cfg

// r99: spiked's config.cfg save writes `unbindall` + only-changed binds, and
// config.cfg executes AFTER default.cfg — so WASD/jump/sprint/strafe get wiped
// on every quit. Re-apply the movement set here; config-mac.cfg runs last in
// every boot chain (TB profile + mac.sh launch both +exec it).
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "ENTER" "+jump"
bind "SHIFT" "+speed"
bind "ALT" "+strafe"
bind "CTRL" "+duck"
bind "TAB" "+showscores"
bind "c" "+movedown"
bind "ESCAPE" "togglemenu"
bind "`" "toggleconsole"
